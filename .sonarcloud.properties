# Análisis automático de SonarQube Cloud (CP-022 / RQ-MAN-02).
# Se excluyen los archivos que no son código del sistema ni de sus pruebas:
# reportes generados por herramientas (Playwright, ZAP), documentos del expediente,
# el dataset de CVs y la cobertura. Justificación en E09 (CP-022).
sonar.exclusions=docs/**,dataset/**,coverage/**
